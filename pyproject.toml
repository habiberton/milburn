[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milburn"
version = "0.1.0"
description = "A local control plane for coordinating long-running Codex agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.6",
]

[project.scripts]
milburn = "milburn.app.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
timeout = 10

