[project]
name = "milburn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Imran Habib", email = "imranhabib14@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.3",
    "langchain>=1.3.4",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.4",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "ta-lib>=0.6.8",
    "tiingo>=0.16.1",
    "typer>=0.26.7",
]

[project.scripts]
milburn = "milburn.cli:app"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.16",
]
